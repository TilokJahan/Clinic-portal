name: Deploy

# Runs after CI passes on main (or by hand). Does nothing until the cloud exists and the GitHub
# variables are set by infra/scripts/export-github-vars.sh (see infra/README.md).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # GitHub OIDC token for Azure login: no stored cloud secrets

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to Azure
    if: >-
      vars.AZURE_CLIENT_ID != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      ACR: ${{ vars.ACR_LOGIN_SERVER }}
      APP_HOST: ${{ vars.APP_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Build and push images
        run: |
          az acr login --name "${ACR%%.*}"
          for s in appointment-service triage-service; do
            docker build -t "$ACR/$s:$TAG" "services/$s"
          done
          # The frontend bakes in the (public) sign-in settings at build time
          docker build -t "$ACR/frontend:$TAG" \
            --build-arg VITE_AUTH_MODE=entra \
            --build-arg VITE_ENTRA_CLIENT_ID="${{ vars.ENTRA_CLIENT_ID }}" \
            --build-arg VITE_ENTRA_AUTHORITY="${{ vars.ENTRA_AUTHORITY }}" \
            frontend
          for s in appointment-service triage-service frontend; do docker push "$ACR/$s:$TAG"; done

      - name: Connect to AKS and install cert-manager
        run: |
          az aks get-credentials --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --name "${{ vars.AKS_NAME }}" --overwrite-existing
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl -n cert-manager rollout status deploy/cert-manager-webhook --timeout=180s

      - name: Fill in cloud values and image tags
        working-directory: infra/k8s/overlays/aks
        env:
          CLOUD_ENV: ${{ vars.CLOUD_ENV }}
        run: |
          printf '%s\n' "$CLOUD_ENV" > cloud.env
          for s in appointment-service triage-service frontend; do
            yq -i "(.images[] | select(.name == \"$s\")) |= (.newName = \"$ACR/$s\" | .newTag = \"$TAG\")" kustomization.yaml
          done

      - name: Apply manifests and load the database schema
        run: |
          kubectl kustomize infra/k8s/overlays/aks --load-restrictor=LoadRestrictionsNone > aks.yaml
          kubectl -n clinic-portal delete job db-init --ignore-not-found
          kubectl apply -f aks.yaml
          kubectl -n clinic-portal wait --for=condition=complete job/db-init --timeout=300s
          kubectl -n clinic-portal logs job/db-init
          # Config changes don't change the pod spec, so restart to pick them up
          kubectl -n clinic-portal rollout restart deploy/appointment-service deploy/triage-service deploy/frontend
          for d in appointment-service triage-service frontend; do
            kubectl -n clinic-portal rollout status deploy/$d --timeout=300s
          done

      - name: Smoke test
        run: |
          # The certificate can take a minute to be issued on the first deploy
          curl -sf --retry 20 --retry-delay 15 --retry-all-errors "https://$APP_HOST/api/health"
          curl -sf "https://$APP_HOST/api/ready"
          curl -sf "https://$APP_HOST/" | grep -q '<div id="root">'
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$APP_HOST/api/queue")" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' "https://$APP_HOST/api/metrics")" = 404
