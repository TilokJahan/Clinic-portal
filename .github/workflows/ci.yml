name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [appointment-service, triage-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    # Throwaway database for tests that need PostgreSQL (CI-only credentials)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . --config ../../pyproject.toml
      - name: Test
        run: pytest -q

  docker-build:
    name: docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: backend
    strategy:
      fail-fast: false
      matrix:
        service: [appointment-service, triage-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push yet)
        run: docker build -t ${{ matrix.service }}:ci services/${{ matrix.service }}

  compose:
    name: docker compose (fresh database)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Start the stack the same way as a developer
        run: |
          cp .env.example .env
          docker compose down -v
          docker compose up --build --detach --wait --wait-timeout 180
      - name: Services answer /health
        run: |
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors             http://localhost:8001/health
          curl --fail --silent --show-error --retry 10 --retry-delay 2 --retry-all-errors             http://localhost:8002/health
      - name: Schema and seed data were loaded
        run: |
          slots=$(docker compose exec -T db psql -U clinic -d clinic -tAc "SELECT count(*) FROM slots")
          echo "seeded slots: $slots"
          test "$slots" -gt 0
      - name: Sign in as a demo patient and clinician
        run: |
          login() {
            curl -sf -X POST http://localhost:8001/auth/dev-login \
              -H 'content-type: application/json' -d "{\"email\": \"$1\"}" | jq -r .access_token
          }
          echo "PATIENT_TOKEN=$(login patient1@example.com)" >> "$GITHUB_ENV"
          echo "CLINICIAN_TOKEN=$(login clinician1@example.com)" >> "$GITHUB_ENV"
          # Without a token the API refuses
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8001/queue)" = 401
      - name: GET /slots returns seeded slots
        run: |
          # Seed slots are on weekdays from tomorrow, so ask for the next weekday
          day=$(date -u -d tomorrow +%F)
          while [ "$(date -u -d "$day" +%u)" -gt 5 ]; do day=$(date -u -d "$day + 1 day" +%F); done
          echo "DAY=$day" >> "$GITHUB_ENV"
          body=$(curl -sf -H "Authorization: Bearer $PATIENT_TOKEN" "http://localhost:8001/slots?date=$day")
          echo "$body" | jq '.[0:3]'
          test "$(echo "$body" | jq length)" -gt 0
      - name: Book, submit intake, see it in the queue, review it
        run: |
          api=http://localhost:8001
          patient=(-H "Authorization: Bearer $PATIENT_TOKEN" -H 'content-type: application/json')
          clinician=(-H "Authorization: Bearer $CLINICIAN_TOKEN" -H 'content-type: application/json')
          slot=$(curl -sf "${patient[@]}" "$api/slots?date=$DAY" | jq '.[0].id')
          appt=$(curl -sf "${patient[@]}" -X POST "$api/appointments" -d "{\"slot_id\": $slot}" | jq '.id')
          # Booking the same slot again is refused
          test "$(curl -s -o /dev/null -w '%{http_code}' "${patient[@]}" -X POST "$api/appointments" \
            -d "{\"slot_id\": $slot}")" = 409
          # Goes through the real triage service (redaction + fake AI client)
          triage=$(curl -sf "${patient[@]}" -X POST "$api/intake" \
            -d "{\"appointment_id\": $appt, \"symptoms\": \"My name is Jane Doe, call 555-123-4567. Chest pain since this morning.\"}")
          echo "$triage" | jq .
          test "$(echo "$triage" | jq -r .ai_urgency)" = urgent
          # Patients can't see the queue; clinicians can
          test "$(curl -s -o /dev/null -w '%{http_code}' "${patient[@]}" "$api/queue")" = 403
          queue=$(curl -sf "${clinician[@]}" "$api/queue")
          test "$(echo "$queue" | jq '.[0].appointment_id')" = "$appt"
          id=$(echo "$triage" | jq .id)
          reviewed=$(curl -sf "${clinician[@]}" -X PATCH "$api/triage/$id" -d '{"final_urgency": "soon"}')
          test "$(echo "$reviewed" | jq .overridden)" = true
          # The live stream sends the current queue straight away (token in the URL for SSE)
          curl -sN --max-time 3 "$api/queue/stream?access_token=$CLINICIAN_TOKEN" | head -c 300 \
            | tee /dev/stderr | grep -q '^event: queue'
          echo "APPT=$appt" >> "$GITHUB_ENV"
      - name: Lab report is read, flagged and gated until a clinician approves
        run: |
          api=http://localhost:8001
          patient=(-H "Authorization: Bearer $PATIENT_TOKEN")
          clinician=(-H "Authorization: Bearer $CLINICIAN_TOKEN")
          report=$(curl -sf "${patient[@]}" -X POST "$api/appointments/$APPT/lab-reports" \
            -F "file=@docs/samples/lab-report-critical-potassium.pdf;type=application/pdf" | jq .id)
          for i in $(seq 1 30); do
            status=$(curl -sf "${clinician[@]}" "$api/appointments/$APPT/lab-reports" | jq -r '.[0].status')
            [ "$status" != processing ] && break; sleep 2
          done
          curl -sf "${clinician[@]}" "$api/appointments/$APPT/lab-reports" | jq '.[0] | {status, reason, results: [.results[] | {display_name, value, unit, flag}]}'
          test "$status" = ready
          # Rules flag the critical value and the queue shows why the patient is urgent
          queue=$(curl -sf "${clinician[@]}" "$api/queue")
          test "$(echo "$queue" | jq -r ".[] | select(.appointment_id == $APPT) | .lab.reason")" = "Critical: potassium 6.8 mmol/L"
          test "$(echo "$queue" | jq -r ".[] | select(.appointment_id == $APPT) | .urgency")" = urgent
          # The patient sees nothing until a clinician approves, then the results
          test "$(curl -sf "${patient[@]}" "$api/appointments/$APPT/lab-reports" | jq '.[0].results | length')" = 0
          curl -sf "${clinician[@]}" -H 'content-type: application/json' -X PATCH "$api/lab-reports/$report" \
            -d '{"patient_explanation": "Your potassium was high. We will call you today."}' > /dev/null
          test "$(curl -sf "${patient[@]}" "$api/appointments/$APPT/lab-reports" | jq '.[0].results | length')" = 5
      - name: Frontend is served and proxies the API
        run: |
          curl -sf http://localhost:8080/ | grep -q '<div id="root">'
          curl -sf http://localhost:8080/queue | grep -q '<div id="root">'   # SPA fallback
          curl -sf http://localhost:8080/api/health | grep -q appointment-service
          curl -sN --max-time 3 "http://localhost:8080/api/queue/stream?access_token=$CLINICIAN_TOKEN" \
            | head -c 200 | grep -q '^event: queue'
      - name: Metrics are recorded but not public
        run: |
          curl -sf http://localhost:8001/metrics | grep -q '^appointments_booked_total 1.0$'
          curl -sf http://localhost:8001/metrics | grep -q 'intakes_total{urgency="urgent"} 1.0'
          curl -sf http://localhost:8002/metrics | grep -q 'redacted_entities_total{entity="PERSON"} 1.0'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/metrics)" = 404
      - name: Logs on failure
        if: failure()
        run: docker compose logs

  terraform:
    name: terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate

  kubernetes:
    name: kubernetes (validate + kind)
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4
      - name: Render and validate both overlays
        run: |
          mkdir -p rendered
          kubectl kustomize infra/k8s/overlays/local --load-restrictor=LoadRestrictionsNone > rendered/local.yaml
          kubectl kustomize infra/k8s/overlays/aks --load-restrictor=LoadRestrictionsNone > rendered/aks.yaml
          ! grep -n 'from-cloud-env' rendered/aks.yaml   # every placeholder was substituted
          docker run --rm -v "$PWD/rendered:/m" ghcr.io/yannh/kubeconform:v0.6.7 -summary -strict \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas /m/local.yaml /m/aks.yaml
      - name: Deploy the local overlay to kind
        run: |
          kind create cluster --name clinic --wait 120s
          for s in appointment-service triage-service frontend; do
            dir=services/$s; [ $s = frontend ] && dir=frontend
            docker build -q -t clinic/$s:local $dir
          done
          kind load docker-image clinic/appointment-service:local clinic/triage-service:local clinic/frontend:local --name clinic
          kubectl apply -f rendered/local.yaml
          for d in appointment-service triage-service frontend; do
            kubectl -n clinic-portal rollout status deploy/$d --timeout=300s
          done
      - name: Smoke test through the frontend Service
        run: |
          kubectl -n clinic-portal port-forward svc/frontend 18080:80 &
          sleep 5
          api=http://localhost:18080/api
          curl -sf $api/ready
          token=$(curl -sf -X POST $api/auth/dev-login -H 'content-type: application/json' \
            -d '{"email": "clinician1@example.com"}' | jq -r .access_token)
          curl -sf -H "Authorization: Bearer $token" $api/queue | jq length
          test "$(curl -s -o /dev/null -w '%{http_code}' $api/metrics)" = 404
      - name: Cluster state on failure
        if: failure()
        run: |
          kubectl -n clinic-portal get pods -o wide
          kubectl -n clinic-portal describe pods | tail -80
          kubectl -n clinic-portal logs -l app.kubernetes.io/part-of=clinic-portal --tail=50 --prefix

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Skipped until the Vite app exists in /frontend. (hashFiles() can't be used in a
      # job-level "if", which made GitHub reject this whole workflow file.)
      - id: app
        run: echo "exists=$([ -f package.json ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - if: steps.app.outputs.exists == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.app.outputs.exists == 'true'
        run: npm ci
      - if: steps.app.outputs.exists == 'true'
        run: npm run build
