server {
    listen 8080;
    root /usr/share/nginx/html;

    # Metrics are for Prometheus inside the cluster, not for the internet
    location = /api/metrics {
        return 404;
    }

    # The browser calls /api/...; forward it to the appointment service without the prefix
    location /api/ {
        proxy_pass http://appointment-service:8000/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
    }

    # Server-Sent Events: no buffering, and keep the connection open between updates
    location = /api/queue/stream {
        proxy_pass http://appointment-service:8000/queue/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Single-page app: unknown paths (e.g. /queue) load index.html and React Router takes over
    location / {
        try_files $uri $uri/ /index.html;
    }
}
