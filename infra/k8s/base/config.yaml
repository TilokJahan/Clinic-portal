# Non-secret settings. Overlays replace values; secrets come from the clinic-secrets Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinic-config
data:
  TRIAGE_SERVICE_URL: http://triage-service:8000
  AUTH_MODE: dev
  TRIAGE_CLIENT: fake
  GCP_PROJECT_ID: ""
  GCP_REGION: us-central1
  GEMINI_MODEL: gemini-2.5-flash
  CORS_ALLOWED_ORIGINS: ""
