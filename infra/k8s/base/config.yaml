# Non-secret settings. Overlays replace values; secrets come from the clinic-secrets Secret.
apiVersion: v1
kind: ConfigMap
metadata:
  name: clinic-config
data:
  TRIAGE_SERVICE_URL: http://triage-service:8000
  AUTH_MODE: dev
  TRIAGE_CLIENT: fake
  AZURE_OPENAI_ENDPOINT: ""
  AZURE_OPENAI_DEPLOYMENT: gpt-4o-mini
  ENTRA_TENANT_ID: ""
  ENTRA_TENANT_SUBDOMAIN: ""
  ENTRA_CLIENT_ID: ""
  CORS_ALLOWED_ORIGINS: ""
  CLINICIAN_EMAILS: ""
  ADMIN_EMAILS: ""
