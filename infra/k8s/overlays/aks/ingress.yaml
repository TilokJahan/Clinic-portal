# HTTPS for the whole app on a free Azure DNS name (<DNS_LABEL>.<region>.cloudapp.azure.com).
# The frontend's nginx serves the app and proxies /api to the appointment service, so browser and
# API share one origin (no CORS). The AKS application routing add-on runs this nginx controller;
# cert-manager gets a Let's Encrypt certificate (installed by the deploy workflow).
apiVersion: approuting.kubernetes.azure.com/v1alpha1
kind: NginxIngressController
metadata:
  name: clinic-nginx
spec:
  ingressClassName: clinic-nginx
  controllerNamePrefix: clinic-nginx
  # One replica is plenty for the demo; each reserves half a CPU
  scaling:
    minReplicas: 1
    maxReplicas: 2
  loadBalancerAnnotations:
    service.beta.kubernetes.io/azure-dns-label-name: from-cloud-env
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: clinic-nginx
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    # Server-Sent Events (/api/queue/stream): keep the connection open and unbuffered
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
spec:
  ingressClassName: clinic-nginx
  tls:
    - hosts: [from-cloud-env]
      secretName: app-tls
  rules:
    - host: from-cloud-env
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
