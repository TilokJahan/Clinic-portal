# Loads db/schema.sql and the synthetic db/seed.sql into Azure Database for PostgreSQL the first
# time only (skips if the users table exists). The database is only reachable inside the virtual
# network. The deploy workflow re-creates this Job on every deploy.
apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: db-init
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: appointment-service
      restartPolicy: Never
      containers:
        - name: psql
          image: postgres:16
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -euo pipefail
              if [ "$(psql "$DATABASE_URL" -tAc "select to_regclass('public.users') is not null")" = t ]; then
                echo "schema already present, nothing to do"
              else
                psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f /sql/01-schema.sql -f /sql/02-seed.sql
                echo "schema and seed loaded"
              fi
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: clinic-secrets
                  key: DATABASE_URL
          volumeMounts:
            - name: sql
              mountPath: /sql
            - name: key-vault
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        - name: sql
          configMap:
            name: db-schema
        - name: key-vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: clinic-key-vault
