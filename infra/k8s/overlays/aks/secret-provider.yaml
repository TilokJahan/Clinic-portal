# Secrets live in Azure Key Vault and are synced into the clinic-secrets Secret by the
# Secrets Store CSI driver (AKS add-on azure-keyvault-secrets-provider), using workload identity.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: clinic-key-vault
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: from-cloud-env
    keyvaultName: from-cloud-env
    tenantId: from-cloud-env
    objects: |
      array:
        - |
          objectName: database-url
          objectType: secret
  secretObjects:
    - secretName: clinic-secrets
      type: Opaque
      data:
        - objectName: database-url
          key: DATABASE_URL
