# Azure Kubernetes Service. Values that differ per deployment (registry, image tag, Key Vault,
# identities, host name, sign-in tenant) live in cloud.env and are filled in by the deploy
# workflow from Terraform outputs (see infra/README.md). Nothing secret is stored here.
#   kubectl kustomize infra/k8s/overlays/aks --load-restrictor=LoadRestrictionsNone | kubectl apply -f -
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: clinic-portal
resources:
  - ../../base
  - secret-provider.yaml
  - ingress.yaml
  - db-init.yaml
images:
  - name: appointment-service
    newName: REGISTRY/appointment-service
    newTag: latest
  - name: triage-service
    newName: REGISTRY/triage-service
    newTag: latest
  - name: frontend
    newName: REGISTRY/frontend
    newTag: latest
configMapGenerator:
  - name: clinic-config
    behavior: merge
    literals:
      - AUTH_MODE=entra-external-id
      - TRIAGE_CLIENT=azure-openai
    envs:
      - cloud.env
  - name: db-schema
    files:
      - 01-schema.sql=../../../../services/appointment-service/db/schema.sql
      - 02-seed.sql=../../../../services/appointment-service/db/seed.sql
patches:
  - path: patches/workload-identity.yaml
replacements:
  # Azure workload identity client ID for both service accounts, from cloud.env
  - source:
      kind: ConfigMap
      name: clinic-config
      fieldPath: data.AZURE_WORKLOAD_CLIENT_ID
    targets:
      - select:
          kind: ServiceAccount
        fieldPaths:
          - metadata.annotations.[azure.workload.identity/client-id]
      - select:
          kind: SecretProviderClass
        fieldPaths:
          - spec.parameters.clientID
  - source:
      kind: ConfigMap
      name: clinic-config
      fieldPath: data.AZURE_KEY_VAULT_NAME
    targets:
      - select:
          kind: SecretProviderClass
        fieldPaths:
          - spec.parameters.keyvaultName
  - source:
      kind: ConfigMap
      name: clinic-config
      fieldPath: data.AZURE_TENANT_ID
    targets:
      - select:
          kind: SecretProviderClass
        fieldPaths:
          - spec.parameters.tenantId
  - source:
      kind: ConfigMap
      name: clinic-config
      fieldPath: data.APP_HOST
    targets:
      - select:
          kind: Ingress
        fieldPaths:
          - spec.rules.0.host
          - spec.tls.0.hosts.0
  - source:
      kind: ConfigMap
      name: clinic-config
      fieldPath: data.DNS_LABEL
    targets:
      - select:
          kind: NginxIngressController
        fieldPaths:
          - spec.loadBalancerAnnotations.[service.beta.kubernetes.io/azure-dns-label-name]
