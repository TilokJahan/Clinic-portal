# The triage service calls Vertex AI with the same keyless Google credentials.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triage-service
spec:
  template:
    spec:
      containers:
        - name: app
          volumeMounts:
            - name: gcp-credentials
              mountPath: /var/run/gcp
              readOnly: true
      volumes:
        # Keyless Google credentials: a Kubernetes token for the GCP workload identity pool, plus
        # the (non-secret) config that tells Google's client libraries how to exchange it.
        - name: gcp-credentials
          projected:
            sources:
              - serviceAccountToken:
                  audience: from-cloud-env
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: gcp-credential-config
                  items:
                    - key: credential-config.json
                      path: credential-config.json
