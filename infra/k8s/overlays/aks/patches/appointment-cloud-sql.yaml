# Cloud SQL Auth Proxy as a native sidecar (init container with restartPolicy: Always), so it
# starts before the app and the app connects to 127.0.0.1:5432. DATABASE_URL in Key Vault is
# postgresql://clinic:<password>@127.0.0.1:5432/clinic. Also mounts the Key Vault secret.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
spec:
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      initContainers:
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.14.1
          restartPolicy: Always
          args:
            - --structured-logs
            - --port=5432
            - from-cloud-env
          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/run/gcp/credential-config.json
          volumeMounts:
            - name: gcp-credentials
              mountPath: /var/run/gcp
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: app
          volumeMounts:
            - name: key-vault
              mountPath: /mnt/secrets
              readOnly: true
      volumes:
        # Keyless Google credentials: a Kubernetes token for the GCP workload identity pool, plus
        # the (non-secret) config that tells Google's client libraries how to exchange it.
        - name: gcp-credentials
          projected:
            sources:
              - serviceAccountToken:
                  audience: from-cloud-env
                  expirationSeconds: 3600
                  path: token
              - configMap:
                  name: gcp-credential-config
                  items:
                    - key: credential-config.json
                      path: credential-config.json
        - name: key-vault
          csi:
            driver: secrets-store.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: clinic-key-vault
